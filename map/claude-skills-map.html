<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Galaxy — 3D Liquid Map</title>
<style>
  :root{
    --bg:#05060c; --panel:rgba(13,16,28,.78); --border:rgba(99,110,160,.25);
    --text:#e2e8f0; --muted:#8896b3; --accent:#6366f1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  #graph{position:absolute;inset:0}

  /* Top bar */
  .hud{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;gap:14px;align-items:center;
       pointer-events:none;z-index:10}
  .hud>*{pointer-events:auto}
  .title{font-weight:700;font-size:15px;color:#fff;letter-spacing:.02em;white-space:nowrap;
         text-shadow:0 0 18px rgba(99,102,241,.8)}
  .title small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:.05em}
  #search{flex:0 1 340px;background:var(--panel);border:1px solid var(--border);border-radius:10px;
          padding:8px 13px;color:var(--text);font-size:13px;outline:none;backdrop-filter:blur(10px)}
  #search:focus{border-color:var(--accent)}

  /* Legend */
  .legend{position:absolute;left:14px;top:70px;display:flex;flex-direction:column;gap:3px;z-index:10;
          background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;
          backdrop-filter:blur(10px);max-height:calc(100vh - 160px);overflow-y:auto;scrollbar-width:thin}
  .lg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);cursor:pointer;
      padding:3px 7px;border-radius:7px;user-select:none;white-space:nowrap}
  .lg:hover{background:rgba(99,102,241,.12);color:var(--text)}
  .lg.active{background:rgba(99,102,241,.22);color:#fff}
  .lg .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
  .lg .n{opacity:.55;font-size:10px;margin-left:auto;padding-left:10px}

  /* Info card */
  .card{position:absolute;right:14px;top:70px;width:330px;background:var(--panel);border:1px solid var(--border);
        border-radius:14px;padding:16px;backdrop-filter:blur(14px);z-index:10;display:none;
        box-shadow:0 8px 40px rgba(0,0,0,.5)}
  .card.show{display:block}
  .card h2{font-size:15px;color:#fff;margin-bottom:2px}
  .card .pk{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}
  .card p{font-size:12px;line-height:1.55;color:var(--muted);max-height:180px;overflow-y:auto;scrollbar-width:thin}
  .card .conns{margin-top:10px;border-top:1px solid var(--border);padding-top:9px}
  .card .conns b{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .card .conns{max-height:46vh;overflow-y:auto;scrollbar-width:thin}
  .card .conns a{display:inline-block;font-size:11px;color:#93c5fd;margin:3px 6px 0 0;cursor:pointer;text-decoration:none}
  .card .conns a:hover{text-decoration:underline}
  .card .x{position:absolute;top:9px;right:12px;color:var(--muted);cursor:pointer;font-size:15px}
  .hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:10.5px;color:#4a5578;
        z-index:10;pointer-events:none;letter-spacing:.03em}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);
       font-size:14px;z-index:20;text-align:center;padding:2rem}
  .mch{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:7px 11px;
       color:var(--muted);cursor:pointer;font-size:12.5px;backdrop-filter:blur(10px)}
  .mch:hover{color:#fff}
  .mch.on{border-color:var(--accent);color:#fff;background:rgba(99,102,241,.28)}
</style>
</head>
<body>
<div id="graph"></div>
<div id="err"></div>

<div class="hud">
  <div class="title">⚛ Skills Galaxy<small id="stats">loading…</small></div>
  <input id="search" type="text" placeholder="Search skills…  (Esc to clear)">
  <div id="modes" style="display:flex;gap:6px">
    <button class="mch on" data-m="all">All</button>
    <button class="mch" data-m="auto" title="Claude can invoke on its own">⚡</button>
    <button class="mch" data-m="proactive" title="Fires eagerly">🔥</button>
    <button class="mch" data-m="manual" title="Slash command only">✋</button>
  </div>
</div>
<div class="legend" id="legend"></div>
<div class="card" id="card">
  <span class="x" onclick="closeCard()">✕</span>
  <h2 id="c-name"></h2>
  <div class="pk" id="c-pack"></div>
  <p id="c-desc"></p>
  <div class="conns" id="c-conns"></div>
</div>
<div class="hint">drag to orbit · scroll to zoom · click an orb · click legend to isolate a pack</div>

<script type="importmap">
{"imports":{
  "three":"https://esm.sh/three@0.180.0",
  "three/":"https://esm.sh/three@0.180.0/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import ForceGraph3D from 'https://esm.sh/3d-force-graph@1.80.0?external=three';
import { UnrealBloomPass } from 'https://esm.sh/three@0.180.0/examples/jsm/postprocessing/UnrealBloomPass.js?external=three';

const PALETTE = {
  'game-theory':'#f43f5e','startup-os':'#f59e0b','gstack':'#6366f1','marketing':'#10b981',
  'pstack':'#38bdf8','hyperframes':'#2dd4bf','dev-tools':'#a78bfa','superpowers':'#e879f9',
  'design-studio':'#f472b6','company-gtm':'#fb923c','ios':'#94a3b8','fullsy':'#84cc16',
  'advisors':'#facc15','anthropic':'#f8fafc','research':'#fb7185','misc':'#64748b'
};
const PACK_LABEL = p => p.replace(/-/g,' ');

// ---------- liquid blob shader ----------
const VERT = `
uniform float uTime; uniform float uSeed; uniform float uAmp;
varying vec3 vN; varying vec3 vV;
void main(){
  vec3 p = position;
  float t = uTime*0.9 + uSeed*17.0;
  float d = sin(p.x*3.1+t)*0.5 + sin(p.y*4.3+t*1.3)*0.3 + sin(p.z*3.7+t*0.7)*0.4
          + sin((p.x+p.y+p.z)*2.2 - t*1.1)*0.35;
  p += normal * d * uAmp;
  vec4 mv = modelViewMatrix * vec4(p,1.0);
  vN = normalize(normalMatrix * normal);
  vV = normalize(-mv.xyz);
  gl_Position = projectionMatrix * mv;
}`;
const FRAG = `
uniform vec3 uColor; uniform float uDim; uniform float uBoost;
varying vec3 vN; varying vec3 vV;
void main(){
  float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.2);
  vec3 deep = uColor * 0.16;
  vec3 col  = mix(deep, uColor*1.65, fres) + uColor * fres * fres * 1.2;
  col *= (0.25 + 0.75*uDim) * uBoost;
  float a = (0.38 + 0.62*fres) * (0.25 + 0.75*uDim);
  gl_FragColor = vec4(col, a);
}`;

const blobGeo = new THREE.IcosahedronGeometry(1, 3);
const materials = [];
function blobMaterial(hex, boost){
  const m = new THREE.ShaderMaterial({
    vertexShader:VERT, fragmentShader:FRAG, transparent:true, depthWrite:false,
    uniforms:{
      uTime:{value:0}, uSeed:{value:Math.random()*100}, uAmp:{value:0.13},
      uColor:{value:new THREE.Color(hex)}, uDim:{value:1}, uBoost:{value:boost}
    }
  });
  materials.push(m);
  return m;
}
function labelSprite(text, hex, sw=46, sh=11.5){
  const c = document.createElement('canvas'); const s = 256; c.width = s*4; c.height = s;
  const g = c.getContext('2d');
  g.font = '700 64px Segoe UI, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.shadowColor = hex; g.shadowBlur = 28; g.fillStyle = '#fff';
  g.fillText(text, c.width/2, s/2);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false, opacity:.95 }));
  sp.scale.set(sw, sh, 1);
  return sp;
}
// per-skill name label, created lazily the first time its cluster is drilled into
function memberLabel(n){
  if(n.__mlbl) return n.__mlbl;
  const sp = labelSprite(n.id, PALETTE[n.pack]||'#fff', 30, 7.5);
  sp.position.y = 6.5;
  sp.visible = false;
  n.__grp.add(sp);
  n.__mlbl = sp;
  return sp;
}

// ---------- load data & build graph ----------
const res = await fetch('skills-map-data.json').catch(()=>null);
if(!res || !res.ok){ document.getElementById('err').style.display='flex';
  document.getElementById('err').textContent='Could not load skills-map-data.json — serve this page from the folder that contains it.'; throw 0; }
const data = await res.json();

const nodes = data.nodes.map(n => ({...n, hub:false}));
const links = data.links.map(l => ({...l}));
const packCounts = {};
for(const n of nodes) packCounts[n.pack] = (packCounts[n.pack]||0)+1;
// hubs + membership links
for(const p of Object.keys(packCounts)){
  nodes.push({id:'__hub_'+p, pack:p, hub:true, desc:''});
  }
for(const n of nodes){ if(!n.hub) links.push({source:n.id, target:'__hub_'+n.pack, kind:'pack'}); }

const neighbors = {};
for(const l of data.links){
  (neighbors[l.source] = neighbors[l.source]||[]).push(l.target);
  (neighbors[l.target] = neighbors[l.target]||[]).push(l.source);
}

document.getElementById('stats').textContent =
  `${data.nodes.length} skills · ${Object.keys(packCounts).length} packs · ${data.links.length} cross-links`;

let activePack = null, query = '', activeMode = 'all';
const visible = n => {
  if(activePack && n.pack !== activePack) return false;
  if(activeMode !== 'all' && !n.hub && (n.mode||'auto') !== activeMode) return false;
  if(query){
    if(n.hub) return PACK_LABEL(n.pack).includes(query);
    return n.id.includes(query) || (n.eli5||'').toLowerCase().includes(query)
        || (n.desc||'').toLowerCase().includes(query);
  }
  return true;
};

const Graph = ForceGraph3D()(document.getElementById('graph'))
  .backgroundColor('#05060c')
  .graphData({nodes, links})
  .nodeLabel(n => n.hub ? '' :
    `<div style="background:rgba(10,12,24,.92);border:1px solid rgba(99,110,160,.4);border-radius:8px;padding:6px 10px;font-size:12px;max-width:280px">
       <b style="color:${PALETTE[n.pack]||'#fff'}">/${n.id}</b><br>
       <span style="color:#8896b3">${n.eli5 || (n.desc||'').slice(0,140)}</span></div>`)
  .nodeThreeObject(n => {
    const hex = PALETTE[n.pack] || '#64748b';
    if(n.hub){
      const grp = new THREE.Group();
      const mesh = new THREE.Mesh(blobGeo, blobMaterial(hex, 1.6));
      mesh.scale.setScalar(7.5);
      const lbl = labelSprite(PACK_LABEL(n.pack), hex);
      lbl.position.y = 12;
      grp.add(mesh, lbl);
      n.__mat = mesh.material; n.__lbl = lbl;
      return grp;
    }
    const deg = (neighbors[n.id]||[]).length;
    // eager skills churn, manual ones sit calm and dim
    const mode = n.mode || 'auto';
    const boost = mode==='proactive' ? 1.3 : mode==='manual' ? 0.8 : 1.0;
    const mesh = new THREE.Mesh(blobGeo, blobMaterial(hex, boost));
    mesh.material.uniforms.uAmp.value = mode==='proactive' ? 0.24 : mode==='manual' ? 0.05 : 0.13;
    mesh.scale.setScalar(2.6 + Math.min(deg,6)*0.45);
    n.__mat = mesh.material;
    const grp = new THREE.Group();
    grp.add(mesh);
    n.__grp = grp;
    return grp;
  })
  .linkColor(l => l.kind==='ref' ? 'rgba(147,197,253,.85)' : 'rgba(99,110,160,.16)')
  .linkWidth(l => l.kind==='ref' ? 1.1 : 0.3)
  .linkOpacity(0.5)
  .linkDirectionalParticles(l => l.kind==='ref' ? 2 : 0)
  .linkDirectionalParticleWidth(1.6)
  .linkDirectionalParticleSpeed(0.004)
  .onNodeClick(n => {
    if(n.hub){ isolatePack(n.pack); }
    else { openCard(n); focusNode(n); }
  })
  .onBackgroundClick(closeCard)
  .enableNodeDrag(false)
  .showNavInfo(false);

Graph.d3Force('link').distance(l => l.kind==='pack' ? 26 : 110);
Graph.d3Force('charge').strength(-42);

// the pane can be 0-size at init — keep the renderer matched to the real container
const gEl = document.getElementById('graph');
function fit(){
  const w = gEl.clientWidth || innerWidth, h = gEl.clientHeight || innerHeight;
  if(w > 0 && h > 0) Graph.width(w).height(h);
}
fit();
addEventListener('resize', fit);
new ResizeObserver(fit).observe(gEl);

// bloom = the glow that sells the liquid look
const USE_BLOOM = new URLSearchParams(location.search).get('bloom') !== '0';
if(USE_BLOOM) try{
  const w = Math.max(2, innerWidth), h = Math.max(2, innerHeight);
  const bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 1.15, 0.65, 0.08);
  bloom.setSize(w, h);
  Graph.postProcessingComposer().addPass(bloom);
  addEventListener('resize', ()=> bloom.setSize(Math.max(2,innerWidth), Math.max(2,innerHeight)));
}catch(e){ console.warn('bloom unavailable', e); }

// animate shader time
(function tick(t){
  const s = t*0.001;
  for(const m of materials) m.uniforms.uTime.value = s;
  requestAnimationFrame(tick);
})(0);

// slow auto-orbit until first interaction
let orbiting = true, angle = 0;
const orbit = setInterval(()=>{
  if(!orbiting) return clearInterval(orbit);
  angle += 0.0028;
  const d = 620;
  Graph.cameraPosition({x:d*Math.sin(angle), y:120, z:d*Math.cos(angle)});
}, 33);
document.getElementById('graph').addEventListener('pointerdown', ()=> orbiting=false, {once:true});
addEventListener('wheel', ()=> orbiting=false, {once:true});

// ---------- filtering ----------
function applyFilter(){
  Graph.graphData().nodes.forEach(n => {
    const v = visible(n);
    if(n.__mat) n.__mat.uniforms.uDim.value = v ? 1 : 0.06;
    if(n.__lbl) n.__lbl.material.opacity = v ? .95 : .06;
    // drill-down: name every orb in the isolated cluster
    const wantLbl = !n.hub && activePack && n.pack===activePack && v;
    if(wantLbl) memberLabel(n).visible = true;
    else if(n.__mlbl) n.__mlbl.visible = false;
  });
  Graph.linkVisibility(l => {
    const s = typeof l.source==='object'?l.source:Graph.graphData().nodes.find(n=>n.id===l.source);
    const t = typeof l.target==='object'?l.target:Graph.graphData().nodes.find(n=>n.id===l.target);
    return visible(s) && visible(t);
  });
}
document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase(); applyFilter();
});
document.querySelectorAll('.mch').forEach(b => b.onclick = () => {
  document.querySelectorAll('.mch').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  activeMode = b.dataset.m;
  applyFilter();
});
addEventListener('keydown', e => { if(e.key==='Escape'){
  query=''; document.getElementById('search').value='';
  activePack = null;
  legend.querySelectorAll('.lg').forEach(x=>x.classList.remove('active'));
  closeCard(); applyFilter(); }});

// legend + isolation
const legend = document.getElementById('legend');
const legendEls = {};
function isolatePack(p){
  activePack = (activePack===p) ? null : p;
  legend.querySelectorAll('.lg').forEach(x=>x.classList.remove('active'));
  if(activePack){
    legendEls[p]?.classList.add('active');
    applyFilter();
    openPackCard(p);
    const hub = Graph.graphData().nodes.find(n=>n.hub&&n.pack===p);
    if(hub) focusNode(hub);
  } else {
    applyFilter();
    closeCard();
  }
}
for(const p of Object.keys(packCounts).sort((a,b)=>packCounts[b]-packCounts[a])){
  const el = document.createElement('div');
  el.className='lg';
  el.innerHTML = `<span class="dot" style="background:${PALETTE[p]};color:${PALETTE[p]}"></span>
                  ${PACK_LABEL(p)} <span class="n">${packCounts[p]}</span>`;
  el.onclick = ()=> isolatePack(p);
  legendEls[p] = el;
  legend.appendChild(el);
}

// pack index panel — alphabetical drill-down list for the isolated cluster
function openPackCard(p){
  document.getElementById('c-name').textContent = PACK_LABEL(p);
  const pk = document.getElementById('c-pack');
  pk.textContent = packCounts[p] + ' skills · click one to fly to it';
  pk.style.color = PALETTE[p]||'#fff';
  document.getElementById('c-desc').textContent = '';
  const members = Graph.graphData().nodes
    .filter(n=>!n.hub && n.pack===p)
    .sort((a,b)=>a.id.localeCompare(b.id));
  const cEl = document.getElementById('c-conns');
  const link = m => `<a data-id="${m.id}" title="${(m.eli5||'').replace(/"/g,'&quot;')}">/${m.id}</a>`;
  const groups = {};
  members.forEach(m => (groups[m.sub || ''] = groups[m.sub || ''] || []).push(m));
  const gNames = Object.keys(groups).sort((a,b)=> groups[b].length-groups[a].length || a.localeCompare(b));
  cEl.innerHTML = (gNames.length > 1)
    ? gNames.map(g =>
        `<div style="margin-top:.65rem"><b style="color:${PALETTE[p]}cc">${g||'Other'} · ${groups[g].length}</b><br>`
        + groups[g].map(link).join('') + '</div>').join('')
    : members.map(link).join('');
  cEl.querySelectorAll('a').forEach(a => a.onclick = ()=>{
    const t = Graph.graphData().nodes.find(x=>x.id===a.dataset.id);
    if(t){ openCard(t); focusNode(t); }
  });
  document.getElementById('card').classList.add('show');
}

// ---------- info card ----------
const MODE_TXT = {auto:'⚡ auto-triggers', proactive:'🔥 fires eagerly', manual:'✋ manual only'};
function openCard(n){
  document.getElementById('c-name').textContent = '/'+n.id;
  const pk = document.getElementById('c-pack');
  pk.textContent = PACK_LABEL(n.pack) + '  ·  ' + (MODE_TXT[n.mode]||MODE_TXT.auto);
  pk.style.color = PALETTE[n.pack]||'#fff';
  document.getElementById('c-desc').textContent = (n.eli5 ? n.eli5 + '\n\n' : '') + (n.desc || 'No description.');
  const conns = neighbors[n.id]||[];
  const cEl = document.getElementById('c-conns');
  cEl.innerHTML = conns.length
    ? '<b>Connected to</b><br>' + conns.map(c=>`<a data-id="${c}">/${c}</a>`).join('')
    : '<b>No cross-references</b>';
  cEl.querySelectorAll('a').forEach(a => a.onclick = ()=>{
    const t = Graph.graphData().nodes.find(x=>x.id===a.dataset.id);
    if(t){ openCard(t); focusNode(t); }
  });
  document.getElementById('card').classList.add('show');
}
function closeCard(){ document.getElementById('card').classList.remove('show'); }
window.closeCard = closeCard;
function focusNode(n){
  orbiting = false;
  const d = 110, r = Math.hypot(n.x,n.y,n.z)||1;
  Graph.cameraPosition(
    {x:n.x*(1+d/r), y:n.y*(1+d/r), z:n.z*(1+d/r)}, n, 1200);
}
</script>
</body>
</html>
